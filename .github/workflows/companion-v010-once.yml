name: One-off companion v0.1.0 release

on:
  push:
    branches: ['release/companion-v0.1.0']

permissions:
  contents: read

concurrency:
  group: one-off-companion-v0.1.0
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'roccowong95/dsh-deeplink' && github.ref == 'refs/heads/release/companion-v0.1.0'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 99bd398906946e2bdc62814e751aa33ee9cf9d20
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate tag and derive companion version
        id: version
        env:
          RELEASE_TAG: companion-v0.1.0
        run: |
          test "$(git rev-parse HEAD)" = '99bd398906946e2bdc62814e751aa33ee9cf9d20'
          VERSION=$(node scripts/release-version.mjs companion "$RELEASE_TAG")
          test "$VERSION" = '0.1.0'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: bash macos/test.sh
      - name: Build universal ad-hoc ZIP with tag version
        env:
          COMPANION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash macos/release.sh universal "$COMPANION_VERSION"
          APP='macos/build/universal/DSH Deeplink.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$COMPANION_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$COMPANION_VERSION"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/DSHDeeplink"
          codesign --verify --strict "$APP"
          cd macos/build
          shasum -a 256 -c "DSH-Deeplink-$COMPANION_VERSION-universal-adhoc.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-v0.1.0
          path: |
            macos/build/DSH-Deeplink-0.1.0-universal-adhoc.zip
            macos/build/DSH-Deeplink-0.1.0-universal-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'roccowong95/dsh-deeplink' && github.ref == 'refs/heads/release/companion-v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout or project scripts in this write-scoped job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: companion-v0.1.0
          path: release
      - name: Create only the authorized tag and publish verified companion assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: roccowong95/dsh-deeplink
          TARGET: 99bd398906946e2bdc62814e751aa33ee9cf9d20
          RELEASE_TAG: companion-v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = companion-v0.1.0
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$TARGET"
          # Fail closed on API errors and never overwrite any existing release.
          existing_release=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == "companion-v0.1.0") | .id')
          if [[ -n "$existing_release" ]]; then
            echo 'Companion release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          test -f release/DSH-Deeplink-0.1.0-universal-adhoc.zip
          test -f release/DSH-Deeplink-0.1.0-universal-adhoc.zip.sha256
          (cd release && sha256sum -c DSH-Deeplink-0.1.0-universal-adhoc.zip.sha256)
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/companion-v0.1.0" \
            --jq '.[] | select(.ref == "refs/tags/companion-v0.1.0") | .object | [.type, .sha] | @tsv')
          if [[ -n "$existing" ]]; then
            read -r type sha <<< "$existing"
            # Accept a lightweight or annotated tag only at the verified commit.
            for _ in {1..10}; do
              if [[ "$type" == commit ]]; then
                break
              fi
              test "$type" = tag
              object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')
              read -r type sha <<< "$object"
            done
            test "$type" = commit
            test "$sha" = "$TARGET"
          else
            test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$TARGET"
            # POST only: a concurrent existing tag fails, never replaces it.
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/companion-v0.1.0 -f sha="$TARGET"
            test "$(gh api "repos/$GH_REPO/git/ref/tags/companion-v0.1.0" --jq '.object.sha')" = "$TARGET"
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$TARGET"
          # GITHUB_TOKEN-created tags do not trigger tag workflows: this run
          # explicitly performs the same build, signing checks, and publication.
          gh release create "$RELEASE_TAG" \
            release/DSH-Deeplink-0.1.0-universal-adhoc.zip \
            release/DSH-Deeplink-0.1.0-universal-adhoc.zip.sha256 \
            --verify-tag --latest=false --title "DSH Deeplink Companion $RELEASE_TAG" \
            --notes 'Universal macOS companion (Apple silicon + Intel), ad-hoc signed. Not Apple-notarized; Gatekeeper may block downloaded apps. SHA-256 checksum included. This does not update the DSH plugin.'
