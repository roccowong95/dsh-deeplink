name: Plugin checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify plugin release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs plugin "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - name: Verify committed client build
        run: git diff --exit-code -- lib
      - run: npm run test:install
      - name: Pack plugin release (no npm publishing)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Upload plugin package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ github.ref_name }}
          path: dist/*.tgz
          if-no-files-found: error
