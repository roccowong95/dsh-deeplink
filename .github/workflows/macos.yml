name: Companion checks

on:
  push:
    # Explicit branches exclude tag pushes: only companion-release handles app tags.
    branches: ['**']
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
      - '.github/workflows/companion-release.yml'
      - 'scripts/release-version.mjs'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
      - '.github/workflows/companion-release.yml'
      - 'scripts/release-version.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Swift URL parser and identity authentication
        run: bash macos/test.sh
      - name: Build and verify ad-hoc universal package
        run: |
          bash macos/release.sh universal
          APP='macos/build/universal/DSH Deeplink.app'
          lipo "$APP/Contents/MacOS/DSHDeeplink" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-check-${{ github.sha }}
          path: |
            macos/build/DSH-Deeplink-*-universal-adhoc.zip
            macos/build/DSH-Deeplink-*-universal-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 14
